name: NPM Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: grep -Pzo "### ${TAG}(?s).*?(?=###|$)" CHANGELOG.md > RELEASE

      - name: Github Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE
